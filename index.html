<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-Informe Académico y Convivencial</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --navy: #002060;
    --black: #000000;
    --line-h: 27px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 12px 60px;
    background: #e9e9ec;
    font-family: Arial, Helvetica, sans-serif;
    color: #111;
  }
  .toolbar {
    max-width: 816px;
    margin: 0 auto 16px;
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    flex-wrap: wrap;
  }
  .toolbar button {
    font-family: inherit;
    font-size: 13px;
    font-weight: bold;
    padding: 10px 16px;
    border-radius: 6px;
    border: 1px solid #002060;
    cursor: pointer;
    letter-spacing: .2px;
  }
  #btnExport { background: var(--navy); color: #fff; }
  #btnExport:hover { background: #001744; }
  #btnNew { background: #fff; color: var(--navy); }
  #btnNew:hover { background: #eef1f8; }
  .hint {
    max-width: 816px;
    margin: 0 auto 14px;
    font-size: 12px;
    color: #555;
    text-align: right;
  }

  .sheet {
    width: 100%;
    max-width: 816px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid #bcbcbc;
    padding: 80px 48px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }

  /* ---------- HEADER ---------- */
  .header {
    display: flex;
    border: 3px solid var(--navy);
    height: 160px;
  }
  .logo-box, .badge-box {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #fafafa;
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
  }
  .logo-box {
    width: 15%;
    border-right: 3px solid var(--navy);
    flex-shrink: 0;
  }

  .title-box {
    flex: 1;
    border-right: 3px solid var(--navy);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6px 10px;
  }
  .title-box .t1 { font-size: 13px; font-weight: 700; margin: 0 0 2px; }
  .title-box .t2 { font-size: 15px; font-weight: 700; margin: 0 0 2px; }
  .title-box .t3 { font-size: 12.5px; font-style: italic; font-family: "Brush Script MT", cursive, Georgia, serif; margin: 0; }

  .right-box {
    width: 22%;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
  }
  .badge-box {
    height: 105px;
    border-bottom: 3px solid var(--navy);
  }
  .date-box {
    flex: 1;
    padding: 6px 6px 4px;
    font-size: 10.5px;
    font-weight: 700;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .date-box .fecha-row {
    display: flex;
    align-items: baseline;
    gap: 4px;
    white-space: nowrap;
  }
  .date-box input[type="date"] {
    font-family: inherit;
    font-size: 10.5px;
    font-weight: 700;
    border: none;
    border-bottom: 1px solid #000;
    width: 100%;
    padding: 1px 2px;
    color: var(--navy);
  }
  .date-box .sub {
    text-align: right;
    font-size: 9px;
    font-weight: 700;
    margin-top: 2px;
  }

  /* ---------- NOMBRE / CURSO ROW ---------- */
  .info-row {
    display: flex;
    border: 1px solid var(--black);
    border-top: none;
    height: 30px;
  }
  .info-row .cell {
    display: flex;
    align-items: center;
    border-right: 1px solid var(--black);
    padding: 4px 6px;
  }
  .info-row .cell:last-child { border-right: none; }
  .lbl-nombre { font-size: 12px; font-weight: 700; flex: 0 0 34%; white-space: nowrap; }
  .val-nombre { flex: 1 1 34%; }
  .lbl-curso { font-size: 12px; font-weight: 700; flex: 0 0 12%; white-space: nowrap; }
  .val-curso { flex: 1 1 20%; }
  .info-row input[type="text"] {
    width: 100%;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 12.5px;
    padding: 2px;
    background: transparent;
  }

  /* ---------- SITUACION LABEL ---------- */
  .situacion-label {
    border: 1px solid var(--black);
    border-top: none;
    font-size: 12px;
    font-weight: 700;
    padding: 0 6px;
    display: flex;
    align-items: center;
    height: 30px;
  }

  /* ---------- RULED TEXT AREA ---------- */
  .ruled-wrapper {
    border: 1px solid var(--black);
    border-top: none;
    overflow: hidden; 
    height: calc(51 * var(--line-h));
  }
  #situacionText {
    outline: none;
    font-family: inherit;
    font-size: 13px;
    line-height: var(--line-h);
    padding: 0 6px;
    white-space: pre-wrap; 
    overflow-wrap: break-word;
    background-image: linear-gradient(to bottom, transparent 26px, #000 26px);
    background-size: 100% var(--line-h);
    background-attachment: local;
    width: 100%; 
    height: 100%;
    display: block;
  }
  #situacionText:empty::before {
    content: attr(data-placeholder);
    color: #9a9a9a;
    font-style: italic;
  }

  /* ---------- FIRMAS ---------- */
  .firmas-header {
    border: 1px solid var(--black);
    border-top: none;
    text-align: center;
    font-weight: 700;
    font-size: 13px;
    padding: 5px 0;
  }
  .firma-row {
    display: flex;
    border: 1px solid var(--black);
    border-top: none;
  }
  .firma-row .firma-label {
    flex: 0 0 22%;
    font-size: 12px;
    font-weight: 700;
    padding: 6px;
    border-right: 1px solid var(--black);
    display: flex;
    align-items: center;
  }
  .firma-row input {
    flex: 1;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 12.5px;
    padding: 6px;
    background: transparent;
  }

  @media (max-width: 600px) {
    .title-box .t1 { font-size: 10.5px; }
    .title-box .t2 { font-size: 12px; }
    .title-box .t3 { font-size: 10px; }
    .lbl-nombre, .lbl-curso, .info-row input, .firma-row .firma-label, .firma-row input { font-size: 10.5px; }
  }
</style>
</head>
<body>

  <div class="toolbar">
    <button id="btnNew" type="button">🗋 Nuevo documento</button>
    <button id="btnExport" type="button">⭳ Exportar PDF</button>
  </div>
  <div class="hint">Saltos de línea usados (párrafos): <span id="lineCounter">0</span> / 51</div>

  <div class="sheet" id="sheet">

    <!-- HEADER -->
    <div class="header">
      <!-- Carga automática del logo COSAFA -->
      <div class="logo-box" id="logoBox" style="background-image: url('./img/_COSAFA LOGO v3.png');">
      </div>

      <div class="title-box">
        <p class="t1">PRE-INFORME ACADÉMICO Y CONVIVENCIAL</p>
        <p class="t2">COLEGIO DE LA SAGRADA FAMILIA</p>
        <p class="t3">&ldquo;Acompañando con amor, educamos el corazón&rdquo;</p>
      </div>

      <div class="right-box">
        <!-- Carga automática de las certificaciones Icontec -->
        <div class="badge-box" id="badgeBox" style="background-image: url('./img/icontec-logo-codigo.png');">
        </div>
        
        <div class="date-box">
          <div class="fecha-row">FECHA <input type="date" id="fecha"></div>
          <div class="sub">DD/MM/AA</div>
        </div>
      </div>
    </div>

    <!-- NOMBRE / CURSO -->
    <div class="info-row">
      <div class="cell lbl-nombre">NOMBRE DEL ESTUDIANTE</div>
      <div class="cell val-nombre"><input type="text" id="nombre" autocomplete="off"></div>
      <div class="cell lbl-curso">CURSO:</div>
      <div class="cell val-curso"><input type="text" id="curso" autocomplete="off"></div>
    </div>

    <!-- SITUACION -->
    <div class="situacion-label">SITUACIÓN PRESENTADA</div>
    <div class="ruled-wrapper">
      <div id="situacionText" contenteditable="true" data-placeholder="Escriba aquí la situación presentada..."></div>
    </div>

    <!-- FIRMAS -->
    <div class="firmas-header">FIRMAS</div>
    <div class="firma-row">
      <div class="firma-label">DOCENTE</div>
      <input type="text" id="firmaDocente" autocomplete="off">
    </div>
    <div class="firma-row">
      <div class="firma-label">ESTUDIANTE</div>
      <input type="text" id="firmaEstudiante" autocomplete="off">
    </div>
    <div class="firma-row">
      <div class="firma-label">PADRE DE FAMILIA</div>
      <input type="text" id="firmaPadre" autocomplete="off">
    </div>
    <div class="firma-row">
      <div class="firma-label">COORD. ACADÉMICA</div>
      <input type="text" id="firmaCoord" autocomplete="off">
    </div>

  </div>

<script>
(function(){
  const MAX_LINES = 51;
  const situacion = document.getElementById('situacionText');
  const lineCounter = document.getElementById('lineCounter');

  function currentLines(){
    const text = situacion.innerText.replace(/\u00A0/g,' ');
    if(text === '') return [''];
    return text.split('\n');
  }

  function updateCounter(){
    let lines = currentLines();
    if(lines.length === 1 && lines[0]==='') {
      lineCounter.textContent = '0';
    } else {
      lineCounter.textContent = String(lines.length);
    }
  }

  function setPlainText(lines){
    situacion.textContent = lines.join('\n');
    placeCursorAtEnd(situacion);
  }

  function placeCursorAtEnd(el){
    el.focus();
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  situacion.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      e.preventDefault();
      const lines = currentLines();
      if(lines.length < MAX_LINES){
        document.execCommand('insertText', false, '\n');
      }
      return;
    }
    if((e.ctrlKey || e.metaKey) && ['b','i','u'].includes(e.key.toLowerCase())){
      e.preventDefault();
    }
  });

  situacion.addEventListener('paste', function(e){
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    const existing = currentLines();
    const existingCount = (existing.length===1 && existing[0]==='') ? 0 : existing.length;
    const room = MAX_LINES - existingCount;
    if(room <= 0) return;
    let incoming = text.replace(/\r\n/g,'\n').split('\n').slice(0, room);
    document.execCommand('insertText', false, incoming.join('\n'));
  });

  situacion.addEventListener('input', function(){
    if(situacion.querySelector('*:not(br)')){
      const text = situacion.innerText;
      setPlainText(text.split('\n'));
    }
    let lines = currentLines();
    if(lines.length > MAX_LINES){
      lines = lines.slice(0, MAX_LINES);
      setPlainText(lines);
    }
    updateCounter();
  });

  document.getElementById('btnNew').addEventListener('click', function(){
    if(!confirm('¿Deseas iniciar un nuevo documento? Se borrará todo el contenido actual.')) return;
    document.getElementById('nombre').value='';
    document.getElementById('curso').value='';
    document.getElementById('fecha').value='';
    document.getElementById('firmaDocente').value='';
    document.getElementById('firmaEstudiante').value='';
    document.getElementById('firmaPadre').value='';
    document.getElementById('firmaCoord').value='';
    situacion.textContent='';
    updateCounter();
  });

  document.getElementById('btnExport').addEventListener('click', async function(){
    const btn = this;
    const originalLabel = btn.textContent;
    btn.textContent = 'Generando PDF...';
    btn.disabled = true;
    try{
      const sheet = document.getElementById('sheet');
      
      const originalWidth = sheet.style.width;
      const originalMaxWidth = sheet.style.maxWidth;
      sheet.style.width = '816px';
      sheet.style.maxWidth = 'none';

      const canvas = await html2canvas(sheet, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
      
      sheet.style.width = originalWidth;
      sheet.style.maxWidth = originalMaxWidth;

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p','pt','letter');
      const pageW = pdf.internal.pageSize.getWidth();
      const pageH = pdf.internal.pageSize.getHeight();

      const imgW = pageW;
      const imgH = canvas.height * (imgW / canvas.width);

      let remainingHeight = imgH;
      let renderedPages = 0;
      
      const canvasPageHeightPx = (pageH / imgH) * canvas.height;

      while(remainingHeight > 0){
        const sourceY = renderedPages * canvasPageHeightPx;
        const sliceHeightPx = Math.min(canvasPageHeightPx, canvas.height - sourceY);

        const pageCanvas = document.createElement('canvas');
        pageCanvas.width = canvas.width;
        pageCanvas.height = sliceHeightPx;
        const ctx = pageCanvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0,0,pageCanvas.width,pageCanvas.height);
        ctx.drawImage(canvas, 0, sourceY, canvas.width, sliceHeightPx, 0, 0, canvas.width, sliceHeightPx);

        const pageImgData = pageCanvas.toDataURL('image/png');
        const pageImgH = pageW * (sliceHeightPx / canvas.width);

        if(renderedPages > 0) pdf.addPage();
        pdf.addImage(pageImgData, 'PNG', 0, 0, imgW, pageImgH);

        remainingHeight -= pageH;
        renderedPages++;
        if(renderedPages > 20) break;
      }

      const nombre = document.getElementById('nombre').value.trim();
      const filename = 'pre-informe' + (nombre ? '-' + nombre.replace(/\s+/g,'_').toLowerCase() : '') + '.pdf';
      pdf.save(filename);
    }catch(err){
      alert('Ocurrió un error al generar el PDF. Intenta nuevamente.');
      console.error(err);
    }finally{
      btn.textContent = originalLabel;
      btn.disabled = false;
    }
  });

  updateCounter();
})();
</script>

</body>
</html>
